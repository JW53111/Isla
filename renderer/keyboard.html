<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>isla keyboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 480px;
      height: 370px;
    }
    #pet-canvas {
      position: absolute;
      left: 170px;
      top: 22px;
    }
    #kb-canvas {
      position: absolute;
      left: 0;
      top: 190px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="pet-canvas"></canvas>
    <canvas id="kb-canvas" width="480" height="180"></canvas>
  </div>
  <script src="actions.js"></script>
  <script src="sprite-engine.js"></script>
  <script src="keyboard.js"></script>
</body>
</html>
